<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0a1c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dyna Blast">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <title>Dyna Blast Mobile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
:root {
  --font: "Press Start 2P", "Courier New", monospace;
  --ink: #140c1e;
  --panel: rgba(18, 12, 38, 0.92);
  --panel-edge: #4a3a8a;
  --yellow: #ffe14a;
  --orange: #ff8a1f;
  --red: #ff4a4a;
  --cyan: #7cf2ff;
  --text: #f4f0ff;
  --muted: #9a90c0;
  --fs: clamp(9px, 2.6vh, 14px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: #0d0a1c;
  color: var(--text);
  font-family: var(--font);
  font-size: var(--fs);
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
  overscroll-behavior: none;
}

#game { position: fixed; inset: 0; display: block; image-rendering: pixelated; }

.hidden { display: none !important; }

button {
  font-family: var(--font);
  font-size: var(--fs);
  color: var(--text);
  background: #3b2d78;
  border: 0;
  border-radius: 4px;
  padding: 0.9em 1.2em;
  box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.35), inset 0 2px 0 rgba(255, 255, 255, 0.18), 0 3px 0 var(--ink);
  cursor: pointer;
  touch-action: manipulation;
  text-shadow: 2px 2px 0 var(--ink);
}
button:active { transform: translateY(2px); box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.35), 0 1px 0 var(--ink); }
button.primary { background: linear-gradient(#ff9a2a, #e4501a); }
button:disabled { opacity: 0.4; pointer-events: none; }

/* ---------------------------------------------------------------- screens */
#screens {
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse at center, rgba(13, 10, 28, 0.35), rgba(13, 10, 28, 0.88));
  padding: max(10px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
.screen { display: none; height: 100%; flex-direction: column; align-items: center; justify-content: center; gap: 2.2vh; overflow-y: auto; }
.screen.active { display: flex; }
.title {
  margin: 0;
  font-size: calc(var(--fs) * 1.6);
  color: var(--yellow);
  text-shadow: 3px 3px 0 #b8380e, 6px 6px 0 var(--ink);
  letter-spacing: 1px;
  text-align: center;
}

.menu-layout { display: flex; align-items: center; justify-content: center; gap: 6vw; width: 100%; }
.logo { text-align: center; }
.logo-main {
  font-size: clamp(28px, 13vh, 76px);
  line-height: 1.05;
  color: var(--yellow);
  text-shadow: 0 4px 0 #ff8a1f, 0 8px 0 #d6381a, 5px 12px 0 var(--ink);
  animation: logoPulse 2.4s ease-in-out infinite;
}
.logo-sub { margin-top: 2.5vh; color: var(--cyan); font-size: calc(var(--fs) * 1.1); text-shadow: 2px 2px 0 var(--ink); letter-spacing: 3px; }
.logo-bombs { margin-top: 2vh; display: flex; justify-content: center; gap: 14px; }
.logo-bombs i {
  width: 22px; height: 22px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #6a6a90 0 18%, #24243a 20%);
  box-shadow: 0 0 0 2px var(--ink);
  position: relative;
  animation: bob 1s ease-in-out infinite;
}
.logo-bombs i:nth-child(2) { animation-delay: 0.2s; }
.logo-bombs i:nth-child(3) { animation-delay: 0.4s; }
.logo-bombs i::after { content: ''; position: absolute; top: -6px; left: 12px; width: 4px; height: 4px; background: var(--yellow); box-shadow: 0 0 6px var(--orange); }
@keyframes logoPulse { 50% { transform: scale(1.04) rotate(-1deg); } }
@keyframes bob { 50% { transform: translateY(-5px); } }

.menu-buttons { display: flex; flex-direction: column; gap: 1.6vh; min-width: min(44vw, 330px); }
.menu-buttons { gap: 1.2vh; }
.menu-buttons button { padding: 0.95em 1em; font-size: calc(var(--fs) * 1.0); }

.setup-grid { display: flex; gap: 4vw; align-items: center; justify-content: center; }
.rows { display: flex; flex-direction: column; gap: 1.3vh; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 14px; background: var(--panel); border: 2px solid var(--panel-edge); padding: 0.45em 0.6em; border-radius: 4px; }
.row label { color: var(--muted); min-width: 8.5em; }
.sel { display: flex; align-items: center; gap: 6px; }
.sel .val { min-width: 12.5em; text-align: center; color: var(--text); cursor: pointer; }
.sel .arr { padding: 0.55em 0.75em; background: #2a2058; }
.preview { display: flex; flex-direction: column; align-items: center; gap: 8px; }
#map-preview { width: min(26vw, 33vh * 1.15); aspect-ratio: 15 / 13; image-rendering: pixelated; border: 3px solid var(--ink); box-shadow: 0 0 0 2px var(--panel-edge), 6px 6px 0 rgba(0, 0, 0, 0.5); }
.map-name { color: var(--cyan); font-size: calc(var(--fs) * 0.85); text-align: center; max-width: 30vw; }
.actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }

.twop-grid { display: flex; gap: 2vw; }
.card-btn { display: flex; flex-direction: column; gap: 10px; width: min(27vw, 230px); min-height: 22vh; align-items: center; justify-content: center; text-align: center; }
.card-btn b { color: var(--yellow); font-size: calc(var(--fs) * 1.05); }
.card-btn small { font-size: calc(var(--fs) * 0.7); line-height: 1.5; color: #d8d0f8; font-weight: normal; }

.room { text-align: center; background: var(--panel); border: 2px solid var(--panel-edge); padding: 2.4vh 2vw; border-radius: 4px; width: min(36vw, 320px); }
.room-label { color: var(--muted); }
.room-code { font-size: clamp(26px, 10vh, 54px); color: var(--yellow); letter-spacing: 8px; margin: 2vh 0; text-shadow: 3px 3px 0 #b8380e; }
.status { color: var(--cyan); font-size: calc(var(--fs) * 0.8); line-height: 1.6; min-height: 3em; }
.join-box { display: flex; flex-direction: column; align-items: center; gap: 2vh; }
.code-input, .name-input {
  font-family: var(--font);
  background: #0d0a1c;
  color: var(--yellow);
  border: 3px solid var(--panel-edge);
  border-radius: 4px;
  text-align: center;
  text-transform: uppercase;
  outline: none;
  user-select: text;
  -webkit-user-select: text;
}
.code-input { font-size: clamp(26px, 10vh, 54px); width: 6.2em; letter-spacing: 8px; padding: 0.2em; }
.name-input { font-size: var(--fs); width: 12.5em; padding: 0.5em; }

.settings-rows { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2vh 1.4vw; }
.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1vh 1vw; width: min(94vw, 900px); }
.st { background: var(--panel); border: 2px solid var(--panel-edge); padding: 0.8em; border-radius: 4px; display: flex; flex-direction: column; gap: 0.7em; }
.st span { color: var(--muted); font-size: calc(var(--fs) * 0.72); }
.st b { color: var(--yellow); font-size: calc(var(--fs) * 1.15); }

/* ---------------------------------------------------------------- overlays */
.overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(8, 5, 20, 0.72); z-index: 20; padding: 8px; }
.panel { background: var(--panel); border: 3px solid var(--panel-edge); box-shadow: 0 0 0 3px var(--ink), 8px 8px 0 rgba(0, 0, 0, 0.6); border-radius: 6px; padding: 2.6vh 2.6vw; display: flex; flex-direction: column; align-items: center; gap: 2vh; max-height: 100%; overflow-y: auto; }
.col-buttons { display: flex; flex-direction: column; gap: 1.4vh; min-width: 260px; }
.results { min-width: min(80vw, 640px); gap: 1.4vh; }
.res-head { font-size: calc(var(--fs) * 1.3); color: var(--cyan); letter-spacing: 3px; }
.res-winner { display: flex; align-items: center; gap: 14px; font-size: calc(var(--fs) * 2); color: var(--yellow); text-shadow: 3px 3px 0 #b8380e; animation: winPop 0.6s cubic-bezier(.2, 1.8, .4, 1); }
.res-winner img { width: calc(var(--fs) * 3.4); image-rendering: pixelated; animation: bob 0.6s ease-in-out infinite; }
@keyframes winPop { from { transform: scale(0.2); opacity: 0; } }
.res-info { color: var(--muted); font-size: calc(var(--fs) * 0.8); }
.res-table { border-collapse: collapse; width: 100%; font-size: calc(var(--fs) * 0.85); }
.res-table th { color: var(--muted); font-weight: normal; text-align: left; padding: 0.4em 0.6em; font-size: calc(var(--fs) * 0.7); }
.res-table td { padding: 0.35em 0.6em; border-top: 2px solid rgba(255, 255, 255, 0.06); }
.res-table tr.win td { color: var(--yellow); }
.res-table tr.dead td.pl { opacity: 0.6; }
.res-table td.pl { display: flex; align-items: center; gap: 8px; }
.res-table td.pl img { width: 22px; image-rendering: pixelated; }
.pws { display: flex; flex-wrap: wrap; gap: 6px; }
.pw-count { display: inline-flex; align-items: center; gap: 2px; }
.pw-count img { width: 16px; image-rendering: pixelated; }
.muted { color: var(--muted); }
.res-status { color: var(--cyan); min-height: 1em; font-size: calc(var(--fs) * 0.85); }

#toast { position: fixed; left: 50%; top: 14px; transform: translate(-50%, -150%); background: #b8241a; padding: 0.9em 1.2em; border-radius: 4px; box-shadow: 0 0 0 3px var(--ink); z-index: 50; transition: transform 0.25s, opacity 0.25s; text-align: center; max-width: 90vw; line-height: 1.5; opacity: 0; pointer-events: none; }
#toast.show { transform: translate(-50%, 0); opacity: 1; }
#fps { position: fixed; left: 50%; bottom: 4px; transform: translateX(-50%); font-size: 9px; color: #7f7; z-index: 40; text-shadow: 1px 1px 0 #000; }

/* ---------------------------------------------------------------- HUD */
#hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
.hud-side { position: absolute; top: max(6px, env(safe-area-inset-top)); display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0 8px; }
#hud-left { left: 0; }
#hud-right { right: 0; }
.hud-card { background: rgba(10, 6, 24, 0.72); border: 2px solid rgba(120, 100, 200, 0.5); border-radius: 4px; padding: 6px 8px; display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 230px; }
.hud-card.dead { opacity: 0.45; filter: grayscale(1); }
.hud-name { display: flex; align-items: center; gap: 6px; font-size: calc(var(--fs) * 0.8); white-space: nowrap; overflow: hidden; }
.hud-name img { width: 20px; image-rendering: pixelated; }
.hud-label { color: var(--muted); font-size: calc(var(--fs) * 0.7); }
.hud-stats { display: flex; flex-wrap: wrap; gap: 4px 6px; font-size: calc(var(--fs) * 0.72); }
.hs { display: inline-flex; align-items: center; gap: 3px; }
.hs img { width: 15px; image-rendering: pixelated; }
.hs.pw { opacity: 0.18; filter: grayscale(1); }
.hs.pw.on { opacity: 1; filter: none; animation: bob 1s ease-in-out infinite; }
.rival-list { display: flex; flex-direction: column; gap: 4px; }
.rival-count { color: var(--yellow); font-size: calc(var(--fs) * 1.1); }
.rival { display: flex; align-items: center; gap: 6px; font-size: calc(var(--fs) * 0.68); }
.rival img { width: 16px; image-rendering: pixelated; }
.rival i { color: var(--yellow); font-style: normal; margin-left: auto; }
.rival.dead { opacity: 0.35; text-decoration: line-through; }
#hud-top { position: absolute; top: 0; left: 50%; transform: translateX(-50%); display: flex; align-items: flex-start; gap: 6px; }
#hud-timer {
  background: rgba(10, 6, 24, 0.75); padding: 4px 10px; border-radius: 0 0 6px 6px;
  font-size: calc(var(--fs) * 0.8); color: var(--text); border: 2px solid rgba(120, 100, 200, 0.5); border-top: 0;
}
#hud-timer.hurry { color: var(--red); animation: blink 0.5s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0.4; } }
#btn-pause {
  margin-top: 2px;
  pointer-events: auto; padding: 0.45em 0.7em; font-size: calc(var(--fs) * 0.8); opacity: 0.85;
}

/* ---------------------------------------------------------------- touch controls */
#controls { position: fixed; inset: 0; z-index: 6; pointer-events: none; }
.ctl-set { position: absolute; inset: 0; pointer-events: none; }
.pad-zone { position: absolute; pointer-events: auto; touch-action: none; }
.dpad, .joy { position: absolute; pointer-events: none; }
.dpad::before {
  content: ''; position: absolute; inset: 0; border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02) 70%);
  border: 2px solid rgba(255, 255, 255, 0.12);
}
.dpad-arm {
  position: absolute; background: rgba(60, 46, 120, 0.75);
  box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.35), 0 0 0 2px rgba(20, 12, 30, 0.8);
  border-radius: 6px;
}
.dpad-arm::after { content: ''; position: absolute; left: 50%; top: 50%; border: 8px solid transparent; transform: translate(-50%, -50%); }
.dpad-arm.up { left: 34%; width: 32%; top: 2%; height: 38%; }
.dpad-arm.down { left: 34%; width: 32%; bottom: 2%; height: 38%; }
.dpad-arm.left { top: 34%; height: 32%; left: 2%; width: 38%; }
.dpad-arm.right { top: 34%; height: 32%; right: 2%; width: 38%; }
.dpad-arm.up::after { border-bottom-color: rgba(255, 255, 255, 0.7); margin-top: -4px; }
.dpad-arm.down::after { border-top-color: rgba(255, 255, 255, 0.7); margin-top: 4px; }
.dpad-arm.left::after { border-right-color: rgba(255, 255, 255, 0.7); margin-left: -4px; }
.dpad-arm.right::after { border-left-color: rgba(255, 255, 255, 0.7); margin-left: 4px; }
.dpad-center { position: absolute; left: 34%; top: 34%; width: 32%; height: 32%; background: rgba(60, 46, 120, 0.75); }
.joy .dpad-center { display: none; }
.dpad[data-dir="up"] .dpad-arm.up, .dpad[data-dir="down"] .dpad-arm.down,
.dpad[data-dir="left"] .dpad-arm.left, .dpad[data-dir="right"] .dpad-arm.right { background: rgba(255, 160, 40, 0.9); }
.joy { border-radius: 50%; background: rgba(255, 255, 255, 0.07); border: 3px solid rgba(255, 255, 255, 0.2); opacity: 0.6; }
.joy.active { opacity: 1; }
.joy-knob {
  position: absolute; left: 30%; top: 30%; width: 40%; height: 40%; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #8f7ad8, #3b2d78);
  box-shadow: 0 0 0 3px rgba(20, 12, 30, 0.8);
}
.btn-bomb, .btn-det {
  position: absolute; pointer-events: auto; border-radius: 50%; padding: 0;
  display: flex; align-items: center; justify-content: center; touch-action: none;
}
.btn-bomb {
  background: radial-gradient(circle at 38% 32%, #ff9a7a, #e4321a 55%, #9a1a10);
  box-shadow: inset 0 -6px 0 rgba(0, 0, 0, 0.35), 0 0 0 3px var(--ink), 0 6px 0 var(--ink);
  font-size: calc(var(--fs) * 0.95);
}
.btn-det {
  background: radial-gradient(circle at 38% 32%, #fff3a0, #e0a810 60%, #8a6200);
  box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.35), 0 0 0 3px var(--ink), 0 4px 0 var(--ink);
  font-size: calc(var(--fs) * 0.7);
  color: #2a1a00; text-shadow: none;
  animation: pulse 0.9s ease-in-out infinite;
}
@keyframes pulse { 50% { filter: brightness(1.25); } }
.btn-bomb.pressed, .btn-det.pressed { transform: translateY(4px) scale(0.96); box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.35), 0 0 0 3px var(--ink), 0 2px 0 var(--ink); }

/* ---------------------------------------------------------------- orientation */
#rotate { display: none; }
@media (orientation: portrait) and (max-width: 820px) {
  #rotate {
    position: fixed; inset: 0; z-index: 100; background: #0d0a1c;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; text-align: center; padding: 20px;
  }
  #rotate p { color: var(--yellow); line-height: 1.6; }
  #rotate .phone { width: 50px; height: 86px; border: 4px solid var(--text); border-radius: 8px; animation: rot 1.6s ease-in-out infinite; }
}
@keyframes rot { 50% { transform: rotate(-90deg); } }

@media (max-height: 420px) {
  .settings-rows { gap: 0.8vh 1vw; }
  .row { padding: 0.3em 0.5em; }
  .menu-buttons button { padding: 0.9em 1em; }
}

/* ---------------------------------------------------------------- settings tabs & keys */
.tabs { display: flex; gap: 8px; }
.tab { background: #241a4e; padding: 0.6em 1em; font-size: calc(var(--fs) * 0.85); }
.tab.active { background: linear-gradient(#ff9a2a, #e4501a); }
.settings-rows.keys-grid { grid-template-columns: 1fr 1fr; align-items: start; }
.key-col { display: flex; flex-direction: column; gap: 0.8vh; }
.key-title { color: var(--yellow); text-align: center; font-size: calc(var(--fs) * 0.9); }
.key-row { padding: 0.25em 0.5em; }
.key-row label { min-width: 7em; font-size: calc(var(--fs) * 0.8); }
.key-btn { min-width: 9.5em; padding: 0.45em 0.6em; font-size: calc(var(--fs) * 0.8); background: #2a2058; }
.key-btn.waiting { background: #e4501a; animation: blink 0.5s steps(2) infinite; }
.key-reset { grid-column: 1 / -1; justify-self: center; font-size: calc(var(--fs) * 0.8); padding: 0.6em 1em; }
.hint { grid-column: 1 / -1; color: var(--muted); font-size: calc(var(--fs) * 0.7); line-height: 1.6; text-align: center; margin: 0; max-width: 80vw; }
.pause-hint { color: var(--muted); font-size: calc(var(--fs) * 0.65); line-height: 1.6; text-align: center; margin: 0; max-width: 70vw; }

/* ---------------------------------------------------------------- adventure */
#ov-stage { background: rgba(8, 5, 20, 0.85); }
.stage-box { text-align: center; animation: winPop 0.5s cubic-bezier(.2, 1.8, .4, 1); }
.stage-title { font-size: calc(var(--fs) * 2.4); color: var(--yellow); text-shadow: 3px 3px 0 #b8380e, 6px 6px 0 var(--ink); }
.stage-sub { margin-top: 3vh; color: var(--cyan); font-size: calc(var(--fs) * 1.2); }
.adv-line { display: flex; justify-content: space-between; gap: 8px; font-size: calc(var(--fs) * 0.75); }
.adv-line b { color: var(--yellow); }
.adv-hearts { color: #ff4a6a; letter-spacing: 2px; }
.hs.status { color: var(--cyan); font-size: calc(var(--fs) * 0.62); width: 100%; }
.hs.status.bad { color: #d78aff; }
/* ---------------------------------------------------------------- characters, campaign, story */
.char-row { flex-wrap: wrap; row-gap: 4px; }
.char-val { display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.char-val img { width: calc(var(--fs) * 1.9); image-rendering: pixelated; }
.char-trait { width: 100%; text-align: right; color: var(--cyan); font-size: calc(var(--fs) * 0.68); }
.adv-desc { text-align: left; max-width: 34em; margin: -0.4vh 0 0.4vh; color: var(--cyan); }
#scr-adv .rows { max-width: min(56vw, 560px); }
#scr-adv .hint { text-align: left; }
.rank { background: var(--panel); border: 2px solid var(--panel-edge); border-radius: 4px; padding: 1.4vh 1.2vw; min-width: min(34vw, 330px); max-height: 62vh; overflow-y: auto; }
.rank-title { color: var(--yellow); text-align: center; margin-bottom: 1vh; font-size: calc(var(--fs) * 0.9); }
.rank-table, .res-table { border-collapse: collapse; width: 100%; font-size: calc(var(--fs) * 0.72); }
.rank-table th { color: var(--muted); font-weight: normal; text-align: left; padding: 0.3em 0.4em; font-size: calc(var(--fs) * 0.62); }
.rank-table td { padding: 0.3em 0.4em; border-top: 2px solid rgba(255, 255, 255, 0.06); }
.rank-table tr.win td { color: var(--yellow); }
.rank-table td.pl { display: flex; align-items: center; gap: 6px; }
.rank-table td.pl img { width: 18px; image-rendering: pixelated; }
.story { width: min(88vw, 760px); gap: 2.4vh; z-index: 30; }
#ov-story { background: rgba(8, 5, 20, 0.9); z-index: 25; }
.story-main { display: flex; gap: 3vw; align-items: center; width: 100%; }
.story-art { flex: none; width: min(18vh, 120px); height: min(18vh, 120px); display: flex; align-items: center; justify-content: center; background: radial-gradient(circle, #2a1e5a, #120c26 70%); border: 3px solid var(--panel-edge); border-radius: 6px; }
.story-art img { width: 70%; image-rendering: pixelated; animation: bob 1.2s ease-in-out infinite; }
.story-art img.boss { width: 92%; }
.story-body { display: flex; flex-direction: column; gap: 1.6vh; min-height: 22vh; }
.story-title { color: var(--yellow); font-size: calc(var(--fs) * 1.15); text-shadow: 2px 2px 0 #b8380e; line-height: 1.4; }
.story-text { margin: 0; line-height: 1.8; font-size: calc(var(--fs) * 0.85); color: var(--text); }
@media (max-height: 420px) {
  .char-trait { font-size: calc(var(--fs) * 0.62); }
  .story-text { line-height: 1.6; }
}

/* ---------------------------------------------------------------- online lobby */

    this.margins = { left: 0, right: 0, top: 0, bottom: 0 };
    this.shakeEnabled = true;
    this.rect = { x: 0, y: 0, w: BW, h: BH, s: 1 };
    this.resize();
  }

  setMargins(m) {
    this.margins = { left: 0, right: 0, top: 0, bottom: 0, ...m };
    this.resize();
  }

  reset() {
    this.particles.list = [];
    this.popups = [];
    this.glows = [];
    this.shake = 0;
    this.flash = 0;
    this.banner = null;
    this.statKey = '';
  }

  resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const W = window.innerWidth, H = window.innerHeight;
    this.dpr = dpr;
    this.canvas.width = Math.round(W * dpr);
    this.canvas.height = Math.round(H * dpr);
    this.canvas.style.width = W + 'px';
    this.canvas.style.height = H + 'px';
    const m = this.margins;
    const aw = Math.max(100, W - m.left - m.right) * dpr;
    const ah = Math.max(100, H - m.top - m.bottom) * dpr;
    let s = Math.min(aw / BW, ah / BH);
    if (s >= 2.5) s = Math.floor(s);       // crisp integer scaling when possible
    const w = BW * s, h = BH * s;
    const x = m.left * dpr + (aw - w) / 2;
    const y = m.top * dpr + (ah - h) / 2;
    this.rect = { x: Math.round(x), y: Math.round(y), w: Math.round(w), h: Math.round(h), s };
  }

  // board-pixel -> screen (device px)
  toScreen(px, py) {
    return [this.rect.x + px * this.rect.s, this.rect.y + py * this.rect.s];
  }

  handleEvent(ev) {
    const P = this.particles;
    const cx = (ev.x + 0.5) * TILE, cy = (ev.y + 0.5) * TILE;
    switch (ev.type) {
      case 'explode': {
        this.shake = Math.min(7, this.shake + 1.6 + ev.chain * 0.6);
        P.burst(cx, cy, 10, { speed: 70, colors: ['#fff6b0', '#ffd23a', '#ff8a1f'], life: 0.45, size: 1 });
        P.burst(cx, cy, 4, { speed: 18, colors: ['#5a5060', '#7a7080'], life: 0.9, size: 5, kind: 'smoke' });
        this.glows.push({ x: cx, y: cy, t: 0, life: 0.4, r: 26 + ev.cells * 3 });
        if (ev.chain >= 2) {
          const color = ev.chain >= 4 ? '#ff4fd8' : '#ffe14a';
          const prev = this.popups.find((p) => p.chainId === ev.chainId);
          if (prev) Object.assign(prev, { text: `COMBO x${ev.chain}`, x: cx, y: cy - 6, t: 0, color });
          else this.popups.push({ text: `COMBO x${ev.chain}`, x: cx, y: cy - 6, t: 0, life: 1.1, color, chainId: ev.chainId });
          if (ev.chain >= 3) this.flash = Math.min(0.35, 0.12 + ev.chain * 0.04);
        }
        break;
      }
      case 'brick': {
        const th = THEMES[this.themeKey] || THEMES.grass;
        P.burst(cx, cy, 9, { speed: 40, up: 60, g: 260, colors: [th.brick, th.brickHi, th.brickDark], life: 0.8, size: 2 });
        break;
      }
      case 'reveal':
        P.burst(cx, cy, 8, { speed: 30, colors: ['#ffffff', '#fff27a'], life: 0.5, kind: 'star' });
        break;
      case 'pickup':
        P.burst(cx, cy, 12, { speed: 55, colors: ['#ffffff', '#7cf2ff', '#fff27a'], life: 0.55, kind: 'star' });
        this.popups.push({ text: ev.label || '', x: cx, y: cy - 10, t: 0, life: 0.9, color: '#ffffff', small: true });
        break;
      case 'itemBurn':
        P.burst(cx, cy, 6, { speed: 20, colors: ['#3a3040'], life: 0.7, size: 4, kind: 'smoke' });
        break;
      case 'death':
        P.add({ kind: 'ghost', x: ev.x * TILE, y: ev.y * TILE - 6, life: 1.4 });
        P.burst(ev.x * TILE, ev.y * TILE, 14, { speed: 60, colors: ['#ffffff', PLAYER_STYLES[ev.style ?? 0]?.body || '#fff'], life: 0.6, size: 2 });
        this.shake = Math.min(8, this.shake + 3);
        break;
      case 'wall':
        P.burst(cx, cy + 6, 6, { speed: 30, colors: ['#9a9088', '#c8c0b8'], life: 0.6, size: 4, kind: 'smoke' });
        this.shake = Math.min(4, this.shake + 0.6);
        break;
      case 'kick':
        P.burst(cx, cy, 5, { speed: 30, colors: ['#ffffff'], life: 0.3, size: 1 });
        break;
      case 'hurry':
        this.banner = { text: 'POŚPIESZ SIĘ!', t: 0, life: 2.6, color: '#ff4a4a' };
        break;
      case 'teleport':
        P.burst((ev.fromX + 0.5) * TILE, (ev.fromY + 0.5) * TILE, 10, { speed: 40, colors: ['#d070ff', '#ffffff'], life: 0.5, kind: 'star' });
        P.burst(cx, cy, 10, { speed: 40, colors: ['#d070ff', '#ffffff'], life: 0.5, kind: 'star' });
        break;
      case 'shieldBreak':
        P.burst(cx, cy, 18, { speed: 70, colors: ['#7cf2ff', '#ffffff'], life: 0.6, kind: 'star' });
        this.popups.push({ text: 'TARCZA!', x: cx, y: cy - 10, t: 0, life: 0.9, color: '#7cf2ff', small: true });
        break;
      case 'curse':
        this.popups.push({ text: ev.label, x: cx, y: cy - 10, t: 0, life: 1.2, color: '#d78aff', small: true });
        break;
      case 'roundEvent':
        this.banner = { text: ev.label, t: 0, life: 2.4, color: { bombRain: '#ff6a3a', itemRain: '#7cf2ff', turbo: '#ffe14a', darkness: '#b090ff', regrow: '#9adf6a' }[ev.kind] || '#ffffff' };
        break;
      case 'meteor':
        P.burst(cx, cy + 4, 6, { speed: 30, colors: ['#9a9088', '#c8c0b8'], life: 0.5, size: 3, kind: 'smoke' });
        this.shake = Math.min(4, this.shake + 1);
        break;
      case 'grow':
        P.burst(cx, cy, 5, { speed: 20, colors: ['#9adf6a', '#ffffff'], life: 0.5, kind: 'star' });
        break;
      case 'monsterDeath':
        P.burst(cx, cy, 12, { speed: 50, colors: ['#ffffff', '#ffe14a', '#ff8a3d'], life: 0.5, kind: 'star' });
        if (ev.points) this.popups.push({ text: String(ev.points), x: cx, y: cy - 8, t: 0, life: 1.0, color: '#ffe14a', small: true });
        break;
      case 'monsterSpawn':
        P.burst(cx, cy, 10, { speed: 30, colors: ['#b070ff', '#ffffff'], life: 0.5, kind: 'star' });
        break;
      case 'bossHit':
        P.burst(cx, cy - 6, 16, { speed: 70, colors: ['#ffffff', '#ffe14a', '#ff5a2a'], life: 0.6, kind: 'star' });
        this.popups.push({ text: ev.hp > 0 ? `TRAFIENIE! ${ev.hp}` : 'K.O.!', x: cx, y: cy - 22, t: 0, life: 1.0, color: '#ff8a5a', small: true });
        this.shake = Math.min(8, this.shake + 3);
        break;
      case 'bossDeath':
        for (let k = 0; k < 4; k++) P.burst(cx + (k % 2 ? 8 : -8), cy - 6 + (k > 1 ? 8 : -8), 16, { speed: 90, colors: ['#ffffff', '#ffe14a', '#ff8a1f', '#ff4fd8'], life: 0.9, kind: 'star' });
        this.glows.push({ x: cx, y: cy, t: 0, life: 0.9, r: 70 });
        this.popups.push({ text: String(ev.points), x: cx, y: cy - 24, t: 0, life: 1.8, color: '#ffe14a' });
        this.banner = { text: 'BOSS POKONANY!', t: 0, life: 2.4, color: '#ffe14a' };
        this.flash = 0.5;
        this.shake = 10;
        break;
      case 'bossWindup':
        this.popups.push({ text: '!!', x: cx, y: cy - 26, t: 0, life: 0.6, color: '#ff4a4a' });
        break;
      case 'bossStomp':
        P.burst(cx, cy + 4, 8, { speed: 40, colors: ['#9a9088', '#c8c0b8'], life: 0.6, size: 4, kind: 'smoke' });
        this.shake = Math.min(6, this.shake + 3);
        break;
      case 'bossCast':
        P.burst(cx, cy - 10, 12, { speed: 45, colors: ['#d070ff', '#7cf2ff', '#ffffff'], life: 0.6, kind: 'star' });
        break;
      case 'doorReveal':
        P.burst(cx, cy, 14, { speed: 40, colors: ['#ffe14a', '#ffffff'], life: 0.8, kind: 'star' });
        this.popups.push({ text: 'WYJŚCIE!', x: cx, y: cy - 10, t: 0, life: 1.4, color: '#ffe14a', small: true });
        break;
      case 'doorAngry':
        this.popups.push({ text: 'NIE BOMBARDUJ WYJŚCIA!', x: cx, y: cy - 10, t: 0, life: 1.4, color: '#ff6a6a', small: true });
        break;
      case 'stageClear':
        this.banner = { text: 'ETAP UKOŃCZONY!', t: 0, life: 2, color: '#ffe14a' };
        break;
      case 'start':        this.banner = { text: 'START!', t: 0, life: 0.9, color: '#ffe14a', big: true };
        break;
      default:
    }
  }

  buildStatic(game) {
    const g = this.sg;
    const b = game.board;
    const tiles = themeTiles(game.theme);
    for (let y = 0; y < b.h; y++) {
      for (let x = 0; x < b.w; x++) {
        const t = b.tiles[b.idx(x, y)];
        const px = x * TILE, py = y * TILE;
        if (t === T_WALL) g.drawImage(tiles.wall, px, py);
        else if (t === T_BRICK) g.drawImage(tiles.brick, px, py);
        else {
          const dark = (x + y) % 2;
          g.drawImage(tiles.floors[dark][Math.floor(hash(x, y) * 4)], px, py);
          if (b.tile(x, y - 1) !== 0) {
            g.fillStyle = 'rgba(0,0,0,0.28)';
            g.fillRect(px, py, TILE, 3);
            g.fillStyle = 'rgba(0,0,0,0.12)';
            g.fillRect(px, py + 3, TILE, 2);
          }
          if (b.tile(x - 1, y) !== 0) {
            g.fillStyle = 'rgba(0,0,0,0.12)';
            g.fillRect(px, py, 2, TILE);
          }
        }
      }
    }
  }

  drawFlame(g, x, y, kind, frac, board) {
    const px = x * TILE, py = y * TILE;
    const life = 1 - frac;
    const s = life < 0.12 ? life / 0.12 : frac < 0.45 ? frac / 0.45 : 1;
    const wob = ((Math.floor(this.time * 24) + x * 3 + y * 5) % 3) - 1;
    const base = Math.max(1, Math.round(1.5 + s * 5.5));
    const axis = (h, a0, a1, w) => {
      if (w <= 0 || a1 <= a0) return;
      if (h) g.fillRect(px + a0, py + 8 - w, a1 - a0, w * 2);
      else g.fillRect(px + 8 - w, py + a0, w * 2, a1 - a0);
    };
    for (const [dw, col] of FLAME_LAYERS) {
      const w = base + dw + (dw === 0 ? (wob > 0 ? 1 : 0) : 0);
      if (w <= 0) continue;
      g.fillStyle = col;
      switch (kind) {
        case F_H: axis(true, 0, 16, w); break;
        case F_V: axis(false, 0, 16, w); break;
        case F_END_L: axis(true, 3, 16, w); axis(true, 2, 3, w - 1); axis(true, 1, 2, w - 2); break;
        case F_END_R: axis(true, 0, 13, w); axis(true, 13, 14, w - 1); axis(true, 14, 15, w - 2); break;
        case F_END_U: axis(false, 3, 16, w); axis(false, 2, 3, w - 1); axis(false, 1, 2, w - 2); break;
        case F_END_D: axis(false, 0, 13, w); axis(false, 13, 14, w - 1); axis(false, 14, 15, w - 2); break;
        case F_CENTER:
        default: {
          const r = Math.min(8, w + 1);
          g.fillRect(px + 8 - r, py + 8 - r + 1, r * 2, r * 2 - 2);
          g.fillRect(px + 8 - r + 1, py + 8 - r, r * 2 - 2, r * 2);
          if (board.hasFlame(x - 1, y)) axis(true, 0, 8, w);
          if (board.hasFlame(x + 1, y)) axis(true, 8, 16, w);
          if (board.hasFlame(x, y - 1)) axis(false, 0, 8, w);
          if (board.hasFlame(x, y + 1)) axis(false, 8, 16, w);
        }
      }
    }
  }

  drawPlayer(g, p, game, marker) {
    const frames = bomberFrames(p.style);
    let sx = Math.round((p.x - 0.5) * TILE);
    let sy = Math.round((p.y - 0.5) * TILE) - 4;
    if (!p.alive) {
      const t = game.time - p.deathTime;
      if (t > 1.1 || t < 0) return;
      if (t < 0.6) {
        const spr = Math.floor(t * 16) % 2 ? frames.flash : frames.down[0];
        g.drawImage(spr, sx - 1, sy - 1);
      } else {
        const k = 1 - (t - 0.6) / 0.5;
        const h = Math.max(1, Math.round(18 * k));
        g.globalAlpha = Math.max(0, k);
        g.drawImage(frames.flash, 0, 0, 18, 18, sx - 1 - Math.round((1 - k) * 4), sy - 1 + (18 - h), 18 + Math.round((1 - k) * 8), h);
        g.globalAlpha = 1;
      }
      return;
    }
    g.fillStyle = 'rgba(0,0,0,0.3)';
    g.fillRect(sx + 3, sy + 18, 10, 2);
    g.fillRect(sx + 4, sy + 17, 8, 4);
    const frame = p.moving ? Math.floor(p.anim * 9) % 4 : 0;
    const set = frames[p.dir] || frames.down;
    g.drawImage(set[frame], sx - 1, sy - 1);
    if (marker) {
      const style = PLAYER_STYLES[p.style % PLAYER_STYLES.length];
      const bob = Math.round(Math.sin(this.time * 6));
      g.fillStyle = '#140c1e';
      g.fillRect(sx + 4, sy - 7 + bob, 9, 3);
      g.fillRect(sx + 6, sy - 4 + bob, 5, 2);
      g.fillStyle = style.hud;
      g.fillRect(sx + 5, sy - 7 + bob, 7, 2);
      g.fillRect(sx + 7, sy - 5 + bob, 3, 2);
    }
  }

  render(game, dt, opts = {}) {
    this.time += dt;
    this.themeKey = game.theme;
    const ctx = this.ctx;
    const g = this.lg;
    const board = game.board;
    const th = THEMES[game.theme] || THEMES.grass;

    const key = game.theme + ':' + board.version;
    if (key !== this.statKey) {
      this.buildStatic(game);
      this.statKey = key;
    }
    g.drawImage(this.stat, 0, 0);

    const spr = sprites();
    const tiles = themeTiles(game.theme);
    drawFeatures(g, board, this.time);
    if (game.monsters) drawDoor(g, game, this.time);

    // items & burning bricks
    for (let y = 0; y < board.h; y++) {
      for (let x = 0; x < board.w; x++) {
        const i = board.idx(x, y);
        const it = board.items[i];
        if (it && spr.items[it]) {
          const bob = Math.floor(this.time * 3 + x + y) % 2;
          g.drawImage(spr.items[it], x * TILE, y * TILE - bob);
        }
        if (board.burning[i] > 0) {
          const f = Math.min(3, Math.floor((1 - board.burning[i] / BRICK_BURN_TIME) * 4));
          g.drawImage(tiles.floors[(x + y) % 2][0], x * TILE, y * TILE);
          g.drawImage(tiles.burn[f], x * TILE, y * TILE);
        }
      }
    }

    // bombs
    for (const b of game.bombs) {
      let bx = b.x, by = b.y;
      if (b.slideDir) { const d = DIRS[b.slideDir]; bx += d.x * b.slideOff; by += d.y * b.slideOff; }
      const px = Math.round(bx * TILE), py = Math.round(by * TILE);
      const speed = b.timer < 0.7 && !b.remote ? 18 : 7;
      const f = [0, 1, 2, 1][Math.floor(b.age * speed) % 4];
      g.fillStyle = 'rgba(0,0,0,0.3)';
      g.fillRect(px + 3, py + 13, 10, 2);
      g.drawImage((b.remote ? spr.remoteBomb : spr.bomb)[f], px, py);
      const spark = Math.floor(this.time * 20) % 2;
      if (b.remote) {
        g.fillStyle = spark ? '#ff3030' : '#601010';
        g.fillRect(px + 9, py + 1, 2, 1);
      } else {
        g.fillStyle = spark ? '#ffffff' : '#ffd23a';
        g.fillRect(px + 10, py + (spark ? 0 : 1), 1, 1);
        g.fillStyle = '#ff8a1f';
        g.fillRect(px + 9 + spark, py, 1, 1);
      }
    }

    if (game.meteors && game.meteors.length) drawMeteors(g, game, this.time);

    // flames
    for (let y = 0; y < board.h; y++) {
      for (let x = 0; x < board.w; x++) {
        const i = board.idx(x, y);
        if (board.flames[i] > 0) this.drawFlame(g, x, y, board.flameKind[i], board.flames[i] / FLAME_TIME, board);
      }
    }

    // players (sorted by y for overlap)
    const order = game.players.slice().sort((a, b) => a.y - b.y);
    for (const p of order) {
      if (p.alive && p.invuln > 0 && Math.floor(this.time * 20) % 2) g.globalAlpha = 0.35;
      this.drawPlayer(g, p, game, opts.markers && opts.markers.includes(p.id));
      g.globalAlpha = 1;
      drawPlayerAura(g, p, this.time);
    }
    if (game.monsters && game.monsters.length) drawMonsters(g, game, this.time);
    if (game.boss) drawBoss(g, game, this.time);

    this.particles.update(dt);
    this.particles.draw(g);
    if (game.darkness > 0) drawDarkness(g, game, Math.min(1, game.darkness));

    // ---- compose to screen
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = th.bg;
    ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
    this.drawBackdrop(ctx, th);

    let ox = 0, oy = 0;
    if (this.shakeEnabled && this.shake > 0.05) {
      ox = (Math.random() * 2 - 1) * this.shake * this.rect.s * 0.5;
      oy = (Math.random() * 2 - 1) * this.shake * this.rect.s * 0.5;
    }
    this.shake *= Math.exp(-dt * 9);
    const R = this.rect;
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(R.x + R.s * 3, R.y + R.s * 4, R.w, R.h);
    ctx.drawImage(this.low, Math.round(R.x + ox), Math.round(R.y + oy), R.w, R.h);

    // glow
    ctx.globalCompositeOperation = 'lighter';
    this.glows = this.glows.filter((gl) => (gl.t += dt) < gl.life);
    for (const gl of this.glows) {
      const k = 1 - gl.t / gl.life;
      const [sx, sy] = this.toScreen(gl.x, gl.y);
      const r = gl.r * R.s;
      const grd = ctx.createRadialGradient(sx, sy, 0, sx, sy, r);
      grd.addColorStop(0, `rgba(255,200,90,${0.45 * k})`);
      grd.addColorStop(1, 'rgba(255,90,20,0)');
      ctx.fillStyle = grd;
      ctx.fillRect(sx - r, sy - r, r * 2, r * 2);
    }
    ctx.globalCompositeOperation = 'source-over';

    if (this.flash > 0) {
      ctx.fillStyle = `rgba(255,250,220,${this.flash})`;
      ctx.fillRect(R.x, R.y, R.w, R.h);
      this.flash = Math.max(0, this.flash - dt * 1.2);
    }

    this.drawTexts(ctx, game, dt, opts);
  }

  drawBackdrop(ctx, th) {
    // subtle retro stripes behind the arena
    const W = this.canvas.width, H = this.canvas.height;
    ctx.fillStyle = 'rgba(255,255,255,0.025)';
    const step = Math.max(8, Math.round(12 * this.dpr));
    const off = (this.time * 10 * this.dpr) % (step * 2);
    for (let y = -step * 2 + off; y < H; y += step * 2) ctx.fillRect(0, y, W, step);
  }

  text(ctx, str, x, y, size, color, align = 'center') {
    ctx.font = `${Math.round(size)}px ${FONT}`;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    const o = Math.max(2, Math.round(size / 8));
    ctx.fillStyle = '#140c1e';
    ctx.fillText(str, x + o, y + o);
    ctx.fillText(str, x - o * 0.5, y);
    ctx.fillText(str, x + o * 0.5, y - o * 0.5);
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
  }

  drawTexts(ctx, game, dt, opts) {
    const R = this.rect;
    this.popups = this.popups.filter((p) => (p.t += dt) < p.life);
    for (const p of this.popups) {
      const [sx, sy] = this.toScreen(p.x, p.y - p.t * 14);
      const size = (p.small ? 5 : 8) * R.s;
      ctx.globalAlpha = p.t > p.life * 0.7 ? (p.life - p.t) / (p.life * 0.3) : 1;
      this.text(ctx, p.text, sx, sy, size, p.color);
      ctx.globalAlpha = 1;
    }
    const cxs = R.x + R.w / 2, cys = R.y + R.h / 2;
    if (game.state === 'countdown') {
      const n = Math.ceil(game.countdown);
      const k = game.countdown - Math.floor(game.countdown);
      this.text(ctx, String(n), cxs, cys, (26 + k * 14) * R.s, '#ffe14a');
      if (opts.subtitle) this.text(ctx, opts.subtitle, cxs, cys + 34 * R.s, 7 * R.s, '#ffffff');
    }
    if (this.banner) {
      const b = this.banner;
      b.t += dt;
      if (b.t > b.life) this.banner = null;
      else {
        const pop = Math.min(1, b.t * 6);
        const size = (b.big ? 22 : 12) * R.s * (0.6 + 0.4 * pop);
        ctx.globalAlpha = b.t > b.life - 0.3 ? (b.life - b.t) / 0.3 : 1;
        if (Math.floor(b.t * 6) % 2 === 0 || b.big) this.text(ctx, b.text, cxs, cys, size, b.color);
        ctx.globalAlpha = 1;
      }
    }
    if (opts.overlayText) this.text(ctx, opts.overlayText, cxs, cys, 10 * R.s, '#ffffff');
    if (game.boss && game.boss.alive) this.drawBossBar(ctx, game.boss);
  }

  drawBossBar(ctx, boss) {
    const R = this.rect;
    const w = Math.round(R.w * 0.46), h = Math.max(4, Math.round(5 * R.s));
    const x = Math.round(R.x + (R.w - w) / 2), y = Math.round(R.y + 9 * R.s);
    ctx.fillStyle = '#140c1e';
    ctx.fillRect(x - 3, y - 3, w + 6, h + 6);
    ctx.fillStyle = '#3a1020';
    ctx.fillRect(x, y, w, h);

      this.sentDet = this.detSeq;
      this.link.send({

  // after the victory: a new run from world 1

  }

    this.paused = on;

  }

  dispose() {}
}

}

function drawMapPreview(canvas, mapId) {
  const g = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  g.clearRect(0, 0, W, H);
  if (mapId === 'random') {
    g.fillStyle = '#20183a';
    g.fillRect(0, 0, W, H);
    g.fillStyle = '#ffe14a';
    g.font = `${Math.round(H * 0.5)}px "Press Start 2P", monospace`;
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText('?', W / 2, H / 2 + 4);
    return;
  }
  const { board, theme } = buildMap(mapId, 4242);
  const th = THEMES[theme];
  const cs = Math.floor(Math.min(W / board.w, H / board.h));
  const ox = Math.floor((W - cs * board.w) / 2), oy = Math.floor((H - cs * board.h) / 2);
  for (let y = 0; y < board.h; y++) {
    for (let x = 0; x < board.w; x++) {
      const t = board.tiles[board.idx(x, y)];
      g.fillStyle = t === 1 ? th.wallTop : t === 2 ? th.brick : ((x + y) % 2 ? th.floorB : th.floorA);
      g.fillRect(ox + x * cs, oy + y * cs, cs, cs);
      if (t === 1) { g.fillStyle = th.wallSide; g.fillRect(ox + x * cs, oy + y * cs + cs - 2, cs, 2); }
      if (t === 2) { g.fillStyle = th.brickDark; g.fillRect(ox + x * cs, oy + y * cs + cs - 1, cs, 1); }
      const f = board.features[board.idx(x, y)];
      if (f) { g.fillStyle = f === 1 ? '#c040ff' : '#ffb020'; g.fillRect(ox + x * cs + 2, oy + y * cs + 2, cs - 4, cs - 4); }
    }
  }
  [[1, 1], [board.w - 2, board.h - 2], [board.w - 2, 1], [1, board.h - 2]].forEach(([x, y], k) => {
    g.fillStyle = PLAYER_STYLES[k].body;
    g.fillRect(ox + x * cs + 2, oy + y * cs + 2, cs - 4, cs - 4);
  });
}

class UI {

    this.current = null;
    this.toastTimer = null;
    this.link = null;

    document.querySelectorAll('[data-go]').forEach((b) => {
      b.addEventListener('click', () => {
        audio.unlock();
        audio.play('click');
        const go = b.dataset.go;
        if (go === 'menu') this.app.toMenu();
        else if (go === 'adventure') this.app.openAdventure();
        else if (go === 'bots' || go === 'local') this.openSetup(go);
        else if (go === 'host') this.openHost();
        else if (go === 'join') this.openJoin();
        else if (go === 'settings') this.openSettings();
        else if (go === 'stats') this.openStats();
        else this.showScreen(go);
      });
    });
    $('#btn-resume').onclick = () => { audio.play('click'); this.app.setPaused(false); };

  // Story pages with a typewriter effect. Enter/Space/tap = next, Esc = skip.
  showStory(pages, done) {
    this.closeStory();
    this.hideOverlays();
    this.showScreen(null);
    const ov = $('#ov-story');
    const img = $('.story-art img', ov), title = $('.story-title', ov), text = $('.story-text', ov);
    let i = 0, full = '', shown = 0, timer = null;
    const finishTyping = () => { clearInterval(timer); timer = null; text.textContent = full; };
    const show = () => {
      const pg = pages[i];
      title.textContent = pg.title;
      const art = pg.art || {};
      img.src = art.boss ? bossIconURL(art.boss) : art.item ? itemIconURL(art.item) : bomberIconURL(art.hero || 0);
      img.className = art.boss ? 'boss' : '';
      full = pg.text;
      shown = 0;
      text.textContent = '';
      clearInterval(timer);
      timer = setInterval(() => {
        shown += 2;
        text.textContent = full.slice(0, shown);
        if (shown >= full.length) finishTyping();
      }, 22);
      $('[data-act="next"]', ov).textContent = i === pages.length - 1 ? 'GRAJ! ▶' : 'DALEJ ▶';
    };
    const close = (callDone) => {
      clearInterval(timer);
      window.removeEventListener('keydown', onKey, true);
      ov.classList.add('hidden');
      this.storyCleanup = null;
      if (callDone) done();
    };
    const next = () => {
      if (timer) { finishTyping(); return; }
      i++;
      if (i >= pages.length) close(true);
      else show();
    };
    const onKey = (e) => {
      if (e.code === 'Enter' || e.code === 'NumpadEnter' || e.code === 'Space') { e.preventDefault(); e.stopImmediatePropagation(); next(); } else if (e.code === 'Escape') { e.stopImmediatePropagation(); close(true); }
    };
    window.addEventListener('keydown', onKey, true);
    $('[data-act="next"]', ov).onclick = () => { audio.play('click'); next(); };
    $('[data-act="skip"]', ov).onclick = () => { audio.play('back'); close(true); };
    this.storyCleanup = close;
    ov.classList.remove('hidden');
    show();
  }

  get storyOpen() { return !!this.storyCleanup; }

  skipStory() { if (this.storyCleanup) this.storyCleanup(true); }

  closeStory() { if (this.storyCleanup) this.storyCleanup(false); }

  // ------------------------------------------------------------ online
  openHost() {
    const scr = $('#scr-host');
    const rows = $('.rows', scr);
    rows.innerHTML = '';
    const obj = store.setup.online;
    charSelector(rows, 'POSTAĆ', 'character');
    SETUPS.online.rows.forEach((r) => selector(rows, r, obj, () => save()));
    const status = $('.status', scr);
    const codeEl = $('.room-code', scr);
    const list = $('.room-players', scr);
    const startBtn = $('[data-act="start"]', scr);
    startBtn.disabled = true;
    codeEl.textContent = '····';
    status.textContent = 'Tworzenie pokoju…';
    list.innerHTML = '';
    this.showScreen('host');
    if (this.link) this.link.close();
    const link = new NetLink();
    this.link = link;
    this.linkInUse = false;
    const guests = new Map(); // cid -> { cid, name, character }
    const refresh = () => {
      const me = getCharacter(store.settings.character);
      const entries = [{ name: store.settings.name || 'GRACZ', character: me.id, host: true }, ...guests.values()];
      list.innerHTML = entries.map((e) => `<div class="room-player"><img src="${bomberIconURL(getCharacter(e.character).style)}" alt=""><span>${e.name}</span>${e.host ? '<i>HOST</i>' : e.cid && e.cid.startsWith('relay-') ? '<i class="via">PRZEZ SERWER</i>' : ''}</div>`).join('')
        + Array.from({ length: MAX_GUESTS - guests.size }, () => '<div class="room-player empty">wolne miejsce</div>').join('');
      startBtn.disabled = guests.size === 0;
      if (codeEl.textContent !== '····') {
        status.textContent = guests.size ? `Graczy w pokoju: ${guests.size + 1}/4. Możesz zaczynać!` : 'Podaj ten kod znajomym (do 3 osób). Czekam…';
      }
      link.send({ t: 'lobby', host: store.settings.name, players: entries.map((e) => e.name) });
    };
    const tryHost = async (attempt) => {
      const code = randomCode();
      try {
        await link.host(code);
        if (this.link !== link) return;
        codeEl.textContent = code;
        refresh();
      } catch (err) {
        if (this.link !== link) return;
        if (attempt < 2 && /zajęty/.test(err.message)) return tryHost(attempt + 1);
        status.textContent = err.message;
      }
    };
    link.on('message', (m, cid) => {
      if (m.t === 'hello' && !guests.has(cid)) {
        const name = String(m.name || 'GOŚĆ').slice(0, 8).toUpperCase();
        const character = CHARACTERS.some((ch) => ch.id === m.character) ? m.character : null;
        guests.set(cid, { cid, name, character });
        audio.play('pickup');
        refresh();
      } else if (m.t === 'bye') {
        guests.delete(cid);
        link.kick(cid);
        refresh();
      }
    });
    link.on('leave', (cid) => {
      if (this.link !== link) return;
      guests.delete(cid);
      refresh();
    });
    tryHost(0);
    startBtn.onclick = () => {
      const active = [...guests.values()].filter((g) => link.guestIds.includes(g.cid));
      if (!active.length) return;
      audio.play('click');
      this.linkInUse = true;
      this.link = null;
      this.app.startHost(link, obj, active);
    };
    $('[data-act="back"]', scr).onclick = () => { audio.play('back'); link.send({ t: 'bye' }); this.showScreen('twop'); };
  }
  openJoin() {
    const scr = $('#scr-join');

  // Keyboard rebinding: click a key button, then press the new key (Esc = cancel).
  renderKeyRows(rows) {
    const keys = store.settings.keys;
    rows.innerHTML = '';
    for (const [pk, title] of [['p1', 'GRACZ 1'], ['p2', 'GRACZ 2']]) {
      const col = document.createElement('div');
      col.className = 'key-col';
      col.innerHTML = `<div class="key-title">${title}</div>`;
      for (const [act, label] of Object.entries(KEY_ACTIONS)) {
        const r = document.createElement('div');
        r.className = 'row key-row';
        r.innerHTML = `<label>${label}</label><button class="key-btn">${keyLabel(keys[pk][act])}</button>`;
        const btn = $('button', r);
        btn.onclick = () => {
          audio.play('click');
          rows.querySelectorAll('.key-btn').forEach((b) => b.classList.remove('waiting'));
          btn.classList.add('waiting');
          btn.textContent = 'NACIŚNIJ…';
          captureNextKey((code) => {
            if (code) {
              // a key can only do one thing: swap with whatever used it before
              for (const [opk, set] of Object.entries(keys)) {
                for (const [oact, ocode] of Object.entries(set)) {
                  if (ocode === code && !(opk === pk && oact === act)) keys[opk][oact] = keys[pk][act];
                }
              }
              keys[pk][act] = code;
              save();
              this.app.applySettings();
            }
            this.renderKeyRows(rows);
          });
        };
        col.appendChild(r);
      }
      rows.appendChild(col);
    }
    const reset = document.createElement('button');
    reset.className = 'key-reset';
    reset.textContent = 'PRZYWRÓĆ DOMYŚLNE';

      audio.play('click');
      store.settings.keys = { p1: { ...DEFAULT_KEYS.p1 }, p2: { ...DEFAULT_KEYS.p2 } };

      this.app.applySettings();
      this.renderKeyRows(rows);

    $('#btn-newgame').textContent = 'NOWA GRA';
    const ov = $('#ov-results');
    const winner = res.winner >= 0 ? res.rows[res.winner] : null;
    $('.res-head', ov).textContent = res.champion >= 0 ? 'ZWYCIĘZCA MECZU' : winner ? 'ZWYCIĘZCA' : 'REMIS!';
    $('.res-winner', ov).innerHTML = winner
      ? `<img src="${bomberIconURL(res.rows[res.champion >= 0 ? res.champion : res.winner].style)}" alt=""><span>${res.champion >= 0 ? res.championName : winner.name}</span>`
      : '<span>NIKT NIE PRZETRWAŁ</span>';
    const t = Math.round(res.time);
    const series = res.targetWins > 1;
    $('.res-info', ov).textContent = `CZAS RUNDY ${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}` + (res.bestChain > 1 ? ` · COMBO x${res.bestChain}` : '') + (series ? ` · MECZ DO ${res.targetWins}` : '');
    const rows = res.rows.map((r) => {
      const pw = POWERUP_IDS.filter((id) => r.collected[id]).map((id) => `<span class="pw-count"><img src="${itemIconURL(id)}" alt="${POWERUPS[id].label}">${r.collected[id]}</span>`).join('') || '<span class="muted">—</span>';
      return `<tr class="${r.id === res.winner ? 'win' : ''} ${r.alive ? '' : 'dead'}">
        <td class="pl"><img src="${bomberIconURL(r.style)}" alt="">${r.name}</td>
        <td>${r.kills}</td><td class="pws">${pw}</td>${series ? `<td>${r.wins}★</td>` : ''}</tr>`;
    }).join('');
    $('.res-table', ov).innerHTML = `<tr><th>GRACZ</th><th>ELIM.</th><th>BONUSY</th>${series ? '<th>WYGR.</th>' : ''}</tr>` + rows;
    $('.res-status', ov).textContent = '';
    const rem = $('#btn-rematch');
    rem.textContent = series && res.champion < 0 ? 'NASTĘPNA RUNDA' : 'REWANŻ';
    rem.onclick = () => { audio.play('click'); h.rematch(); };
    $('#btn-newgame').onclick = () => { audio.play('click'); h.newGame(); };
    $('#btn-res-menu').onclick = () => { audio.play('back'); h.menu(); };
    ov.classList.remove('hidden');
  }

  setJoinStatus(text) {
    $('#scr-join .status').textContent = text;
  }

  setResultsStatus(text) {
    $('#ov-results .res-status').textContent = text;
  }

  hideOverlays() {
    this.closeStory();
    $('#ov-results').classList.add('hidden');
    $('#ov-pause').classList.add('hidden');
    $('#ov-stage').classList.add('hidden');
  }

  toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(this.toastTimer);
    this.toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
  }
}

return { drawMapPreview, UI };
};
__req('main.js');
})();
</script>
