# Publishes the browser version (folder www/) on GitHub Pages, so the game
# can also be played on any phone or PC straight from a link - and joined
# online together with the APK players.
name: Web version

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['www/**', '.github/workflows/pages.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
