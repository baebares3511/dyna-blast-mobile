# Builds the Android APK in the cloud (no local Android SDK needed) and
# publishes it as a GitHub Release. Phones download the newest version from:
#   https://github.com/<owner>/<repo>/releases/latest/download/DynaBlast.apk
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore: ['**.md']

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: npm install

      - name: Generate Android project
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          npx cap add android
          node scripts/patch-android.mjs
          npx cap sync android

      # One signing key for all builds, kept in the repository, so a new APK
      # installs as an update (otherwise Android refuses: "app not installed").
      - name: Signing key
        run: |
          if [ ! -f signing/debug.keystore ]; then
            mkdir -p signing
            keytool -genkeypair -keystore signing/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Dyna Blast,O=DynaBlast,C=PL"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add signing/debug.keystore
            git commit -m "Add APK signing key [skip ci]"
            git push
          fi
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore

      - name: Gradle build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../DynaBlast.apk

      - uses: actions/upload-artifact@v4
        with:
          name: dyna-blast-apk
          path: DynaBlast.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Dyna Blast — wersja 1.${{ github.run_number }}
          make_latest: true
          files: DynaBlast.apk
          body: |
            **Instalacja na Androidzie:** pobierz `DynaBlast.apk` poniżej (na telefonie), otwórz plik
            i zezwól na instalację z tego źródła. Nowa wersja instaluje się jako aktualizacja.

            Gra w przeglądarce (bez instalacji): zobacz link w README repozytorium.
